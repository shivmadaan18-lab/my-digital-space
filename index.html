
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Digital Space</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #0f172a;
            color: white;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .card {
            width: 100%;
            max-width: 700px;
            text-align: center;
            padding: 50px 25px;
            border-radius: 25px;
            background: linear-gradient(135deg, #1e293b, #312e81);
            box-shadow: 0 20px 60px rgba(0,0,0,0.4);
        }

        .tag {
            color: #c4b5fd;
            letter-spacing: 3px;
            font-size: 14px;
            margin-bottom: 15px;
        }

        h1 {
            font-size: 50px;
            margin-bottom: 20px;
        }

        p {
            color: #cbd5e1;
            font-size: 18px;
            line-height: 1.6;
        }

        .button {
            display: inline-block;
            margin-top: 30px;
            padding: 13px 25px;
            background: white;
            color: #111827;
            text-decoration: none;
            border-radius: 30px;
            font-weight: bold;
        }
    </style>
</head>

<body>

    <div class="card">
        <div class="tag">WELCOME</div>

        <h1>My Digital Space ✨</h1>

        <p>
            A small corner of the internet where I can share
            my projects, ideas and things I'm learning.
        </p>

        <a class="button" href="#about">Explore</a>
    </div>

</body>
</html>
